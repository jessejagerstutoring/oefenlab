<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leerlingen · Oefenlab</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="index.html">
      <span class="logo" aria-hidden="true">O</span>
      <span class="brand-t"><b>Oefenlab</b><small>Overzicht voor begeleiders</small></span>
    </a>
    <div class="top-act"><div id="account-slot"></div></div>
  </div>
</header>

<main class="wrap dash" id="dash">
  <p class="note">Even laden…</p>
</main>

<script src="assets/js/config.js"></script>
<script src="content/wiskunde-a/opgave-1.js"></script>
<script src="assets/js/progress.js"></script>
<script src="assets/js/account.js"></script>
<script>
(() => {
  'use strict';
  const C = COURSE, GOAL = 5, $ = id => document.getElementById(id), esc = Account.esc;
  const num = v => (Number.isFinite(Number(v)) ? Number(v) : 0);
  const DAY = 864e5;
  let rows = [];

  function when(ms) {
    if (!ms) return 'nog niet';
    const d = Math.floor((Date.now() - ms) / DAY);
    return d <= 0 ? 'vandaag' : d === 1 ? 'gisteren' : d < 14 ? `${d} dagen geleden` : new Date(ms).toLocaleDateString('nl-NL', { day: 'numeric', month: 'short' });
  }

  function message(title, text) {
    $('dash').innerHTML = `<section class="dash-msg card" style="--i:0"><h1>${title}</h1><p>${text}</p></section>`;
  }

  async function load() {
    if (!Account.configured) return message('Nog geen accounts', 'Vul eerst de Supabase-gegevens in <code>assets/js/config.js</code> in. Daarna kunnen leerlingen een account maken en zie je hier hun voortgang.');
    if (!Account.user) {
      message('Log in als begeleider', 'Dit overzicht is alleen voor begeleiders.<br><br><button class="btn primary big" id="dash-login">Inloggen</button>');
      $('dash-login').onclick = () => Account.open('login');
      return;
    }
    if (!Account.profile || Account.profile.role !== 'begeleider') return message('Geen toegang', 'Je bent ingelogd als leerling. Dit overzicht is alleen voor begeleiders.');
    const sb = Account.client;
    const [{ data: profiles, error: e1 }, { data: progress, error: e2 }] = await Promise.all([
      sb.from('profiles').select('id, display_name, email, role, created_at'),
      sb.from('progress').select('user_id, data, updated_at').eq('course_id', C.id),
    ]);
    if (e1 || e2) return message('Laden mislukt', 'De gegevens konden niet worden opgehaald. Probeer het later opnieuw.');
    const byUser = new Map((progress || []).map(p => [p.user_id, p]));
    rows = (profiles || []).filter(p => p.role !== 'begeleider').map(p => {
      const pr = byUser.get(p.id), d = (pr && pr.data) || {};
      const stats = d.stats || {}, topics = d.topics || {}, exams = d.exams || {};
      const last = Math.max(0, ...C.topics.map(t => num((topics[t.id] || {}).at)), ...Object.values(exams).map(x => num(x && x.at)));
      return {
        name: p.display_name || '(geen naam)', email: p.email || '', since: Date.parse(p.created_at) || 0,
        n: num(stats.n), c: num(stats.c), last,
        topics: C.topics.map(t => ({ t, c: num((topics[t.id] || {}).c), n: num((topics[t.id] || {}).n) })),
        exams: Object.entries(exams).filter(([k]) => /^\d+$/.test(k)).map(([k, x]) => ({ n: +k, best: num(x && x.best), tot: num(x && x.tot) })).sort((a, b) => a.n - b.n),
      };
    }).sort((a, b) => b.last - a.last || a.name.localeCompare(b.name));
    render('');
  }

  function render(q) {
    const list = rows.filter(r => !q || (r.name + ' ' + r.email).toLowerCase().includes(q.toLowerCase()));
    const week = rows.filter(r => r.last && Date.now() - r.last < 7 * DAY).length;
    $('dash').innerHTML = `
      <section class="dash-head">
        <h1>Leerlingen</h1>
        <div class="dash-tiles">
          <div class="dash-tile"><b>${rows.length}</b><span>leerlingen</span></div>
          <div class="dash-tile"><b>${week}</b><span>actief deze week</span></div>
          <div class="dash-tile"><b>${rows.reduce((s, r) => s + r.n, 0)}</b><span>sommen gemaakt</span></div>
        </div>
      </section>
      <section class="dash-tools">
        <label class="fld" style="flex:1 1 260px"><span class="sr">Zoek een leerling</span><input id="dash-q" placeholder="Zoek op naam of e-mailadres" value="${esc(q)}"></label>
        <div class="dash-legend">${C.topics.map(t => `<span><i style="background:${t.color}"></i>${esc(t.short)}</span>`).join('')}</div>
      </section>
      <section class="dash-list">
        ${list.length ? list.map((r, i) => `
          <article class="card dash-row" style="--i:${Math.min(i, 10)}">
            <div class="dash-who"><b>${esc(r.name)}</b><span>${esc(r.email)}</span><span>Laatst actief: ${when(r.last)}</span></div>
            <div class="dash-num"><b>${r.n}</b><span>gemaakt</span></div>
            <div class="dash-num"><b>${r.c}</b><span>zonder hulp</span></div>
            <div class="dash-topics" aria-label="Voortgang per onderwerp">${r.topics.map(x => `
              <span class="dash-topic" title="${esc(x.t.title)}: ${x.c} van ${GOAL} zonder hulp (${x.n} gemaakt)">
                <span class="bar" style="--c:${x.t.color}"><i style="--w:${Math.min(100, x.c / GOAL * 100)}%"></i></span><small>${esc(x.t.short)}</small>
              </span>`).join('')}</div>
            <div class="dash-exams">${r.exams.length ? r.exams.map(x => `<span class="chip">T${x.n}: ${x.best}/${x.tot}</span>`).join('') : '<span class="note">Nog geen tentamen gemaakt</span>'}</div>
          </article>`).join('') : `<p class="note">${rows.length ? 'Geen leerling gevonden met deze zoekterm.' : 'Er heeft nog geen leerling een account gemaakt.'}</p>`}
      </section>`;
    const inp = $('dash-q');
    inp.oninput = () => { const pos = inp.selectionStart; render(inp.value); const n = $('dash-q'); n.focus(); n.setSelectionRange(pos, pos); };
  }

  Account.onChange(() => { if (Account.ready) load(); });
  Account.init({ courses: [], root: '' });
})();
</script>
</body>
</html>
